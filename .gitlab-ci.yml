# The kubeconfig has to be provided to the "deploy" stage. One possible option would be to use a GitLab CI/CD project/group file variable.
# For this to work, the Terraform providers should point to this file.

stages:
  - build
  - deploy

# Set the image name and tag to the local project's container registry
variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

# Build the image and push it to the local project's container registry
build:
  stage: build
  # Runs the script and provides the Docker CLI
  image: docker:24.0.9
  services:
    # Contains the Docker daemon
    - docker:24.0.9-dind
  # Log in to the local project's container registry
  # Build the image
  # Push the image to the local project's container registry
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

# Run Terraform init and plan. Save the plan output as an artifact.
terraform_plan:
  stage: deploy
  image:
    name: hashicorp/terraform:1.17
    # The default entrypoint is the "terraform" command.
    entrypoint: [""]
  needs: ["build"]
  script:
    - cd "terraform"
    - terraform init
    - terraform plan -var="image_name=$IMAGE_NAME" -var="image_tag=$IMAGE_TAG" -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan

# Apply the Helm chart with Terraform
terraform_apply:
  stage: deploy
  image:
    name: hashicorp/terraform:1.17
  # Only run after the "terraform_plan" job has finished and include its artifacts
  needs:
    - job: terraform_plan
      artifacts: true
  # Only run when manually started by a user
  when: manual
  script:
    - cd "terraform"
    - terraform init
    - terraform apply -auto-approve tfplan
