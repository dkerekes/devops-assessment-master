apiVersion: apps/v1
kind: Deployment
metadata:

  name: {{ include "myapp.name" . }}
  labels:
    app: myapp

spec:
  replicas: {{ .Values.replicas }}

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp
  
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.createServiceAccount }}
      serviceAccountName: {{ .Values.serviceAccountName | quote }}
      {{- end }}

      containers:
        - name: myapp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          
          ports:  
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "{{ .Values.environment }}"

