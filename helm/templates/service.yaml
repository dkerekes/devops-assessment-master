{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.name" . }}
  labels:
    app: myapp

spec:
  type: ClusterIP
  selector:
    app: myapp
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
